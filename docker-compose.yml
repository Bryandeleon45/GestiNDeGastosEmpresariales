name: municompras

services:
  db:
    image: postgres:18-alpine
    container_name: municompras-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${POSTGRES_DB:-GestionCadenadeProveedores}
      TZ: America/Guatemala
      PGTZ: America/Guatemala
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./Backend/migrations:/migrations:ro
      - ./Backend/seeds:/seeds:ro
      - ./docker/local-db:/local-db:ro
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: municompras-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-123456}
      PGDATABASE: ${POSTGRES_DB:-GestionCadenadeProveedores}
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-municompras-jwt-secret-change-me-0123456789}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8443,http://127.0.0.1:8443}
      APP_URL: ${APP_URL:-http://localhost:8443}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Gestion de Proveedores}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_PASS: ${GMAIL_PASS:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./Backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./Frontend/municompras-web
      dockerfile: Dockerfile
    container_name: municompras-frontend
    restart: unless-stopped
    environment:
      PORT: 8443
      VITE_API_URL: /api
      VITE_PROXY_TARGET: http://backend:4000
      VITE_USE_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-8443}:8443"
    volumes:
      - ./Frontend/municompras-web:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  backend_node_modules:
  frontend_node_modules:
